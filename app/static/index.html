<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PLANETAI</title>
<!-- The shell, and nothing else. The frozen layer first, then this page's own stylesheet; the
     renderer writes every element below #page. No inline style and no inline script: both are
     things a reader cannot diff and a gate cannot read without running the page. -->
<link rel="stylesheet" href="static/tokens.css">
<link rel="stylesheet" href="static/planetai-theme.css">
<link rel="stylesheet" href="static/dashboard.css">
</head>
<body>
<!-- What a reader sees between opening the page and boot() answering, and the whole of it. The
     renderer overwrites #page the moment it has an answer; until then this is the page. It is here
     because #page shipped empty: a node whose database is wedged holds GET /issues open rather than
     erroring, and a household — or a wall screen nobody is watching — was left on blank paper with
     nothing to read. Classes only, no ids, all of them already in dashboard.css. -->
<div id="page">
  <header><div class="wrap"><h1 class="brand"><b>PLANETAI</b></h1></div></header>
  <div class="wrap"><p class="note">Asking the node&hellip;</p></div>
</div>
<!-- The ask pane. Outside #page, so a poll that redraws the page does not wipe a thread somebody is in.
     Hidden until a reader opens it; UI_ASK=off never shows it. -->
<aside id="askpane" aria-label="ask the node" hidden></aside>
<!-- What the Set up pane says back. Chrome, not content: the renderer writes only #page. -->
<div class="toast" id="toast"></div>
<!-- ASKING THE NODE. The loading state, over the page rather than instead of it: the renderer writes
     #page underneath while this is up, so when it leaves there is a drawn page behind it and not a
     second flash of blank paper. It plays on first paint, on "ask the node again" and on reconnect
     after the pill has dropped live — never on a poll. The canvas is sized to its own box.
     It ships already on: the first paint is this face (brand, frame and the blink are CSS and move
     before any script arrives) and dashboard.js's open() wires the canvas over it — its `on` is a
     JS flag, so the pre-shown face does not stop it. A browser with scripting off gets the shell
     instead (@media (scripting: none) in dashboard.css) rather than a spinner that would lie. -->
<div class="asking on" id="asking" aria-hidden="false">
  <p class="brand"><b>PLANETAI</b> loading</p>
  <div class="frame"><i class="seed" aria-hidden="true"></i><canvas id="askcv"></canvas></div>
  <div class="aside">
    <p class="hd"><span><i class="blink" aria-hidden="true"></i><b id="ask-what">Asking the node</b></span>
      <span id="ask-count"></span></p>
    <div class="ep" id="ask-ep"></div>
    <p class="big" id="ask-big">----</p>
    <p class="meters" id="ask-meters"></p>
    <p class="rule" id="ask-rule"></p>
  </div>
</div>
<script src="static/d3.min.js"></script>
<script src="static/plot.umd.min.js"></script>
<script src="static/dashboard.js"></script>
</body>
</html>
