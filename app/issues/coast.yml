# Coast. The sea at the nearest ocean grid cell.
#
# A context issue, like land: model-only, no rules at act level. It matters to a fisher, a surf
# school and a warung on the beach, and it asks nobody for anything.
#
# The id and es strings below are ASSISTANT-WRITTEN and have not been read by a native speaker.

name:
  en: Coast
  id: Pantai
  es: Costa

kind: context
metric: wave_height_m
unit: m
dp: 1

line: ~

packs:
  domains: [coast]
  rules: []

# A household does not measure the sea from its roof. Only the region column exists, and it is a
# model sampled at the nearest water cell — never closer than the pack's COAST_MAX_KM allows.
distances:
  room: ~
  yard: ~
  ring: ~
  region:
    from: observations
    sensor_id: marine-point
    metrics: [wave_height_m]

readouts:
  - metric: swell_height_m
    sensor_id: marine-point
    unit: m
    dp: 1
    label: { en: swell, id: alun, es: mar de fondo }
  # wave_period_s, not swell_period_s: the wave period is the one Open-Meteo Marine always answers
  # with, and it is the number a fisher reads. The swell period is carried in Figures when it is there.
  - metric: wave_period_s
    sensor_id: marine-point
    unit: s
    dp: 0
    label: { en: period, id: periode, es: periodo }
  - metric: sea_surface_temp
    sensor_id: marine-point
    unit: °C
    dp: 1
    label: { en: sea, id: laut, es: mar }
  # Singapore: NEA's weekly Enterococcus banding of the beaches this node follows (packs/singapore-beach, BEACH_AREAS).
  # 1 Normal, 2 Elevated, 3 High; the worst of each beach's stretches. Read the stretch nearest the house on the sensor.
  - metric: beach_band
    sensor_id: nea-beach-east-coast
    unit: of 3
    dp: 0
    label: { en: East Coast beach water band, id: pita air pantai East Coast, es: banda del agua de East Coast }
  - metric: beach_band
    sensor_id: nea-beach-changi
    unit: of 3
    dp: 0
    label: { en: Changi beach water band, id: pita air pantai Changi, es: banda del agua de Changi }

# A wave is not over a square of the map.
where:
  en: { region: off this coast }
  id: { region: di lepas pantai ini }
  es: { region: frente a esta costa }

sentences:
  # A word headline (docs/SPEC_language.md): the figures live in context_plain, which the engine
  # renders as the issue's `plain`, and in the hero numeral.
  en:
    state:
      context: "The sea {where}, as the model reads it."
      context_plain: "{n} {unit} {where}. {cmp}"
      none: "No marine model for this point: the nearest ocean cell is further out than the pack will report."
  id:
    state:
      context: "Laut {where}, seperti yang dibaca model."
      context_plain: "{n} {unit} {where}. {cmp}"
      none: "Tidak ada model laut untuk titik ini: sel laut terdekat lebih jauh daripada batas pack."
  es:
    state:
      context: "El mar {where}, según lo lee el modelo."
      context_plain: "{n} {unit} {where}. {cmp}"
      none: "No hay modelo marino para este punto: la celda de océano más cercana está más lejos de lo que el pack informa."

# The supporting layer: where the number comes from, and that the node never asks anything.
about:
  en: "The wave height comes from a marine model at the nearest ocean cell; nothing in the house measures the sea. The node never asks you to do anything about the coast."
  id: "Tinggi gelombang berasal dari model laut di sel laut terdekat; tidak ada di rumah yang mengukur laut. Node tidak pernah meminta Anda melakukan apa pun tentang pantai."
  es: "La altura de ola viene de un modelo marino en la celda de océano más cercana; nada en la casa mide el mar. El nodo nunca te pide que hagas nada con la costa."


# A rule and no line: the sea has a scale a fisher reads, and nothing on it for a household to cross.
hero:
  sign: sign-coast
  pictogram: pix-coast
  unit: m
  dp: 1
  rule:
    min: 0
    max: 4
    ends: { en: [flat, rough], id: [tenang, bergelombang], es: [en calma, picado] }
    dots: [region]
    line: false
  clock: time

empty:
  en: The coast pack reports nothing inland. It needs an ocean cell within COAST_MAX_KM of this node.
  id: Pack coast tidak melaporkan apa pun di pedalaman. Perlu sel laut dalam COAST_MAX_KM dari node ini.
  es: El pack coast no informa nada en el interior. Necesita una celda de océano a menos de COAST_MAX_KM del nodo.
