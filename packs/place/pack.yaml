id: place
name: Place
description: >-
  What is around the node, from OpenStreetMap: buildings and how much ground they cover, shops and warungs, schools,
  clinics, temples, roads, green space, and the walk to the nearest of each. Structure and change, not behaviour.
  Kept in PostGIS on the node; refreshed monthly.
author: PLANETAI core (official, prototype)
version: 0.1.0
requires: { node: ">=0.26.0" }
kind: code
domain: place
metrics: [sat_buildings, sat_confidence, osm_building_coverage, sat_buildings_yearly, sat_height_m_yearly, buildings, built_share, commercial_share, businesses_per_km2, poi_food, poi_retail, poi_education, poi_health, poi_worship, poi_lodging, poi_services, roads_km, green_share, nearest_school_m, nearest_health_m, nearest_market_m, nearest_worship_m]
scales: [community]
# One entry, not two: the registry files OpenStreetMap once, and the amenity counts below come off
# the same Overpass extract as the business ones.
sources: [economic/community/openstreetmap]
env:
  - "# place: radius around the node to describe, in metres, and how often to re-fetch from OpenStreetMap"
  - "PLACE_RADIUS_M=1000"
  - "PLACE_REFRESH_DAYS=30"
  - "# place basemap (planetai run place basemap): half-width in km of the street-level square kept on disk, and the drone ring and its finest zoom"
  - "GROUND_RADIUS_KM=12"
  - "GROUND_DRONE_RADIUS_KM=4"
  - "GROUND_DRONE_MAXZ=18"
pip: [earthengine-api]
attribution: "© OpenStreetMap contributors, ODbL, via Overpass; Google Open Buildings V3 and Temporal v1 (CC BY 4.0) via Earth Engine"
