# The stranger's command, on amd64, on the oldest system docs/PLATFORMS.md claims to support.
#
# Every gate this repository has ran green on 7 September and a tester in Mallorca still could not
# install. Nothing tested the install itself, on a machine that had nothing on it, without a person
# there to press RETURN. This does.
#
# What it asserts, on every push:
#   · exit 0
#   · no interactive prompt — no terminal exists, and a hang fails on the timeout rather than waiting
#   · no sudo and no brew: both are shadowed by a fake that records the call and fails
#   · `make health` answers
#
# It runs the bootstrap byte for byte as the pipe delivers it. Only the source is overridden, with the
# same environment variables a tester can use: the tarball comes from THIS commit, served over HTTP the
# way the site serves it, so a pull request is tested rather than the last release.
name: install smoke
on: [push, pull_request]

jobs:
  amd64-linux:
    # ubuntu-22.04 is x86_64 and the oldest Linux docs/PLATFORMS.md claims (Docker Engine's own list:
    # Jammy 22.04 is the oldest supported LTS). A hosted runner is a clean VM, which is the point.
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }        # bundle.sh reads `git describe`

      - name: build the tarball this commit would ship, and serve it the way the site does
        run: |
          mkdir -p /tmp/site/get
          bash tools/bundle.sh /tmp/site/get
          # The stub now refuses a tarball nobody signed, which is the whole point of it. CI has no
          # release key and must never have one, so this signs with a throwaway and puts its public
          # half into a copy of the stub. The signer line is the only byte that differs from the
          # committed file — every URL, fetch and check below is the real one.
          ssh-keygen -q -t ed25519 -f /tmp/ci_key -N '' -C fabcity
          ssh-keygen -Y sign -f /tmp/ci_key -n planetai-node /tmp/site/get/planetai-node.tar.gz
          blob=$(ssh-keygen -y -f /tmp/ci_key | awk '{print $2}')
          sed -E "s|^(fabcity ssh-ed25519 )[^ ]+|\1$blob|" install > install.signed
          cmp -s install install.signed && { echo "no placeholder in install — CI has stopped testing the signed path"; exit 1; } || true
          ( cd /tmp/site && python3 -m http.server 8099 >/tmp/site.log 2>&1 & )
          for i in $(seq 20); do curl -fsS http://127.0.0.1:8099/get/SHA256 >/dev/null 2>&1 && break; sleep 1; done
          curl -fsS http://127.0.0.1:8099/get/SHA256

      - name: shadow sudo and brew, so a call to either is a failure and not a surprise
        run: |
          mkdir -p /tmp/notools
          for t in sudo brew; do
            printf '#!/bin/sh\necho "$0 $*" >> /tmp/forbidden\nexit 1\n' > /tmp/notools/$t
            chmod +x /tmp/notools/$t
          done
          rm -f /tmp/forbidden

      - name: the stranger's command, with no terminal and nothing to press
        env:
          PLANETAI_SITE: http://127.0.0.1:8099
          PLANETAI_HOME: /home/runner/planetai
          PLANETAI_REF: ${{ github.sha }}     # so the raw fallback resolves too, not only the local copy
        run: |
          cat > /tmp/node.json <<'JSON'
          {"name": "ci-node", "lat": 39.57, "lon": 2.65, "kind": "home", "sensor": {}}
          JSON
          # `cat install | bash -s --` is what the pipe does (CI signs its own tarball, so it pipes install.signed). </dev/null and no tty: a question here hangs,
          # and the timeout turns a hang into a red job instead of a twenty-minute wait.
          PATH="/tmp/notools:$PATH" timeout 900 bash -c 'cat install.signed | bash -s -- --answers /tmp/node.json' </dev/null \
            2>&1 | tee /tmp/TRANSCRIPT_ok.txt
          echo "installer exit: ${PIPESTATUS[0]}"
          # The feedback contract, asserted rather than admired: named steps, elapsed times, a summary.
          grep -q "^\[1/7\] "            /tmp/TRANSCRIPT_ok.txt || { echo "no numbered steps"; exit 1; }
          grep -q "^\[7/7\] "            /tmp/TRANSCRIPT_ok.txt || { echo "never reached the last step"; exit 1; }
          grep -q "done in "               /tmp/TRANSCRIPT_ok.txt || { echo "no elapsed time on a step"; exit 1; }
          grep -q "^install OK — "         /tmp/TRANSCRIPT_ok.txt || { echo "no one-line summary"; exit 1; }
          # The answers file said ci-node. If the summary says bayu-2, the file was silently ignored and
          # the node is in Bali — which is exactly what NUL-stripping in a command substitution did.
          grep -q "^install OK — ci-node," /tmp/TRANSCRIPT_ok.txt || { echo "the answers file was ignored"; exit 1; }
          grep -q "NODE_NAME=ci-node" /home/runner/planetai/.env || { echo ".env does not carry the answered name"; exit 1; }
          # A filesystem path can exceed any budget and nothing can be done about it, so hold the
          # reporter's own lines — steps, heartbeats, the summary — to 100 columns, not every line.
          grep -E '^\[[0-9]+/[0-9]+\]|^ +[0-9]+s |^install (OK|FAILED)|^FAILED:' /tmp/TRANSCRIPT_ok.txt \
            | awk 'length > 100 { print "  too wide (" length "): " $0; n++ } END { exit (n > 0) }' \
            || { echo "a step line is over 100 columns"; exit 1; }

      - name: no sudo, no brew
        run: |
          if [ -s /tmp/forbidden ]; then echo "the install called:"; cat /tmp/forbidden; exit 1; fi
          echo "neither was called"

      - name: make health
        run: |
          cd /home/runner/planetai
          for i in $(seq 60); do curl -sf localhost:8080/health >/dev/null && break; sleep 2; done
          make health

      - name: it is safe to run twice, and the second run does not ask again
        env:
          PLANETAI_SITE: http://127.0.0.1:8099
          PLANETAI_HOME: /home/runner/planetai
          PLANETAI_REF: ${{ github.sha }}     # so the raw fallback resolves too, not only the local copy
        run: |
          PATH="/tmp/notools:$PATH" timeout 900 bash -c 'cat install.signed | bash -s -- --answers /tmp/node.json' </dev/null
          [ -s /tmp/forbidden ] && { cat /tmp/forbidden; exit 1; } || true
          cd /home/runner/planetai && make health

      - name: remove takes the volumes with it, and the next install is a NEW node
        env:
          PLANETAI_SITE: http://127.0.0.1:8099
          PLANETAI_HOME: /home/runner/planetai
          PLANETAI_REF: ${{ github.sha }}
        run: |
          # The failure nobody was testing for. `planetai remove` deleted volumes only through
          # `docker compose down -v`, behind a `|| true`, and it exited silently before even asking on
          # any node whose db container was down (a failing command substitution under `set -e`). So a
          # tester ran remove, saw nothing removed or nothing said, installed again — and got the OLD
          # node back: same readings, same name, because the compose project is the folder's basename
          # and the volume re-attached. Nothing in CI would have noticed.
          before=$(docker volume ls -q | grep -cE '^planetai_(db|mosquitto|reticulum|ipfsdata)$' || true)
          echo "volumes before remove: $before"
          [ "$before" -gt 0 ] || { echo "fixture problem: the installed node left no volumes to remove"; exit 1; }
          name=$(grep '^NODE_NAME=' /home/runner/planetai/.env | cut -d= -f2 | tr -d ' ')
          echo "removing node: $name"
          # remove reads its answers from /dev/tty on purpose, so it needs a real terminal
          python3 tests/pty_run.py y "$name" -- bash /home/runner/planetai/bin/planetai remove \
            > /tmp/TRANSCRIPT_remove.txt 2>&1
          cat /tmp/TRANSCRIPT_remove.txt
          after=$(docker volume ls -q | grep -cE '^planetai_(db|mosquitto|reticulum|ipfsdata)$' || true)
          echo "volumes after remove: $after"
          [ "$after" -eq 0 ] || { echo "remove left $after volume(s) behind — the next install would adopt them"; exit 1; }
          [ -d /home/runner/planetai ] && { echo "remove left the folder"; exit 1; } || true
          grep -q "no containers, no volumes, no folder" /tmp/TRANSCRIPT_remove.txt \
            || { echo "remove did not report a verified clean removal"; exit 1; }
          # and now the part that actually bit somebody: install again, into the same folder, and check
          # that what comes up is a NEW node rather than the old one wearing a new name.
          sed 's/"name": *"[^"]*"/"name": "ci-second"/' /tmp/node.json > /tmp/node2.json
          PATH="/tmp/notools:$PATH" timeout 900 bash -c 'cat install.signed | bash -s -- --answers /tmp/node2.json' </dev/null
          cd /home/runner/planetai
          got=$(grep '^NODE_NAME=' .env | cut -d= -f2 | tr -d ' ')
          [ "$got" = "ci-second" ] || { echo "the second install came up as '$got', not 'ci-second' — it adopted the old node"; exit 1; }
          echo "the second install is its own node: $got"

      - name: a deliberately failed run — the step name, the reason, the resume command
        env:
          PLANETAI_SITE: http://127.0.0.1:8099
          PLANETAI_HOME: /home/runner/planetai-fail
          PLANETAI_REF: ${{ github.sha }}
        run: |
          # Point the database at a tag that does not exist. A registry outage, a typo in a compose file
          # and a wrong tag all land here, and this is the output a tester would paste into an issue.
          # Its own project AND its own database volume: the successful run above left one, and the
          # installer rightly refuses to start a node whose new .env cannot log in to an old volume.
          docker volume rm -f planetai_db >/dev/null 2>&1 || true
          cp -r . /tmp/failrun && cd /tmp/failrun
          sed -i 's|imresamu/postgis:16-3.4-alpine|imresamu/postgis:16-3.4-alpine-DOES-NOT-EXIST|' docker-compose.yml
          cp .env.example .env && sed -i 's|^APP_PORT=.*|APP_PORT=8123|' .env
          set +e
          COMPOSE_PROJECT_NAME=planetai_fail timeout 600 ./install.sh --name ci-fail --lat 39.57 --lon 2.65 --no-bad \
            > /tmp/TRANSCRIPT_fail.txt 2>&1
          rc=$?; set -e
          cat /tmp/TRANSCRIPT_fail.txt
          echo "installer exit: $rc"
          [ "$rc" -eq 0 ] && { echo "expected this run to FAIL and it did not"; exit 1; } || true
          grep -qE "^FAILED: .+"                            /tmp/TRANSCRIPT_fail.txt || { echo "no named step in the failure"; exit 1; }
          grep -qE "^  reason  .+"                          /tmp/TRANSCRIPT_fail.txt || { echo "no reason"; exit 1; }
          grep -q "resume  planetai setup"                 /tmp/TRANSCRIPT_fail.txt || { echo "no resume command"; exit 1; }
          grep -q "^install FAILED at step"                /tmp/TRANSCRIPT_fail.txt || { echo "no one-line summary"; exit 1; }
          grep -qi "Something went wrong"                  /tmp/TRANSCRIPT_fail.txt && { echo "still says Something went wrong"; exit 1; } || true
          echo "the failure names its step, its reason, its log and the way back"

      - name: keep both transcripts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: install-transcripts
          path: |
            /tmp/TRANSCRIPT_ok.txt
            /tmp/TRANSCRIPT_fail.txt
            /tmp/TRANSCRIPT_remove.txt
          if-no-files-found: warn

      - name: what a tester would paste into an issue
        if: always()
        run: bash tools/preflight.sh --json || true

  # Ubuntu Server and Arch (which is what Omarchy is), from a clean userland rather than a CI image with
  # half the world preinstalled. Each container starts with no docker, no curl-installed anything and a
  # non-root user with sudo — the shape of a machine somebody just installed Linux on, which is where
  # Lucas was on 8 September. The host's docker socket is mounted, so the engine the script installs has
  # something to talk to; what is under test is the platform branch, not nested virtualisation.
  clean-linux:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 1          # one machine at a time: the x86 legs drive the SAME host daemon
      matrix:
        include:
          - name: Ubuntu Server 22.04
            runner: ubuntu-22.04
            project: pai_ubuntu
            port: 8131
            image: ubuntu:22.04
            prep: apt-get update -qq && apt-get install -y -qq curl sudo tar ca-certificates python3 openssh-client >/dev/null
          # Lucas's actual machine. There is no official Mint image, so this is Ubuntu 24.04 wearing Mint's
          # os-release and lsb_release: ID=linuxmint with an Ubuntu upstream, which is what our platform
          # detection reads and what get.docker.com resolves through `lsb_release -a -u`.
          - name: Linux Mint 22.3 (Lucas's machine)
            runner: ubuntu-22.04
            project: pai_mint
            port: 8133
            image: ubuntu:24.04
            prep: >-
              apt-get update -qq && apt-get install -y -qq curl sudo tar ca-certificates python3 lsb-release openssh-client >/dev/null &&
              printf 'NAME="Linux Mint"\nVERSION="22.3 (Zara)"\nID=linuxmint\nID_LIKE="ubuntu debian"\nPRETTY_NAME="Linux Mint 22.3"\nVERSION_ID="22.3"\nVERSION_CODENAME=zara\nUBUNTU_CODENAME=noble\n' > /etc/os-release &&
              printf '#!/bin/sh\nif [ "$1$2" = "-a-u" ]; then exit 1; fi\nprintf "Distributor ID:\\tLinuxmint\\nCodename:\\tzara\\n"\n' > /usr/bin/lsb_release && chmod +x /usr/bin/lsb_release
          - name: Arch (what Omarchy is built on)
            runner: ubuntu-22.04
            project: pai_arch
            port: 8132
            image: archlinux:latest
            prep: pacman -Sy --noconfirm --quiet curl sudo tar python openssh >/dev/null
          # The wall, from the other side. Raspberry Pi OS 64-bit is Debian (the Pi's own download page,
          # 15 Sep 2026, is Trixie), and Docker's Raspberry Pi OS install page covers 32-bit only and sends
          # 64-bit users to the Debian instructions — so a Debian container on an arm64 runner is the
          # nearest honest stand-in for a Pi that CI can hold. It is NOT a Pi: no SD card, no thermal
          # throttling, no 4 GB ceiling. What it proves is the one thing that blocked the Pi for a year —
          # that every image the node pulls exists for linux/arm64 and the database comes up on it.
          - name: Debian on arm64 (the Pi's userland, not the Pi)
            runner: ubuntu-24.04-arm
            project: pai_arm64
            port: 8134
            image: debian:13
            prep: apt-get update -qq && apt-get install -y -qq curl sudo tar ca-certificates python3 openssh-client >/dev/null
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: build the tarball this commit would ship, and serve it
        run: |
          mkdir -p /tmp/site/get && bash tools/bundle.sh /tmp/site/get
          # The stub now refuses a tarball nobody signed, which is the whole point of it. CI has no
          # release key and must never have one, so this signs with a throwaway and puts its public
          # half into a copy of the stub. The signer line is the only byte that differs from the
          # committed file — every URL, fetch and check below is the real one.
          ssh-keygen -q -t ed25519 -f /tmp/ci_key -N '' -C fabcity
          ssh-keygen -Y sign -f /tmp/ci_key -n planetai-node /tmp/site/get/planetai-node.tar.gz
          blob=$(ssh-keygen -y -f /tmp/ci_key | awk '{print $2}')
          sed -E "s|^(fabcity ssh-ed25519 )[^ ]+|\1$blob|" install > install.signed
          cmp -s install install.signed && { echo "no placeholder in install — CI has stopped testing the signed path"; exit 1; } || true
          ( cd /tmp/site && python3 -m http.server 8099 >/tmp/site.log 2>&1 & )
          for i in $(seq 20); do curl -fsS http://127.0.0.1:8099/get/SHA256 >/dev/null 2>&1 && break; sleep 1; done
      - name: the stranger's command, on a clean ${{ matrix.name }}
        run: |
          cat > /tmp/run.sh <<'INNER'
          set -e
          PREP_PLACEHOLDER
          useradd -m -s /bin/bash tester
          echo "tester ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/tester
          # The mounted socket carries the HOST's docker gid. Inside the container the docker group gets
          # whatever gid the package picked, so `docker info` fails with a permission error that looks
          # exactly like the real "you are not in the docker group yet" — and is not. Match the gid, so
          # the job tests the installer and not my plumbing.
          SOCK_GID="$(stat -c %g /var/run/docker.sock)"
          getent group docker >/dev/null || groupadd docker
          groupmod -g "$SOCK_GID" docker 2>/dev/null || groupadd -g "$SOCK_GID" hostdocker || true
          usermod -aG "$SOCK_GID" tester 2>/dev/null || usermod -aG docker tester
          # sudo and brew are shadowed: a call to either is a failure, not a surprise.
          mkdir -p /opt/notools
          for t in brew xcode-select; do printf '#!/bin/sh\necho "$0 $*" >> /tmp/forbidden\nexit 1\n' > /opt/notools/$t; chmod +x /opt/notools/$t; done
          rm -f /tmp/forbidden
          cat > /home/tester/node.json <<'JSON'
          {"name": "ci-clean", "lat": 39.95, "lon": 4.05, "kind": "home", "sensor": {}}
          JSON
          chown tester /home/tester/node.json
          # PLANETAI_REF, and it is load-bearing. The stub arrives on stdin here, exactly as a tester runs
          # it, so BASH_SOURCE is unset and `./tools/preflight.sh` is not next to it — which sends the stub
          # down its fetch branch and pulls tools/preflight.sh from raw.githubusercontent at REF, whose
          # default is `main`. So every leg of this job has been checking the preflight on main rather than
          # the one in the commit under test, and it went unnoticed because main's preflight agreed with
          # the branch's on x86. It stopped agreeing the moment a branch changed the arm64 row: CI reported
          # `arch arm64 x the database image is published for linux/amd64 only` from a file the commit had
          # already rewritten. Pin it to this commit and the stub fetches what is actually being tested.
          su tester -c 'cd /home/tester && PATH=/opt/notools:$PATH PLANETAI_SITE=http://172.17.0.1:8099 PLANETAI_HOME=/home/tester/planetai \
            PLANETAI_REF=REF_PLACEHOLDER \
            COMPOSE_PROJECT_NAME=PROJECT_PLACEHOLDER APP_PORT=PORT_PLACEHOLDER \
            timeout 1500 bash -c "cat /work/install.signed | bash -s -- --answers /home/tester/node.json"' </dev/null 2>&1 | tee /tmp/T.txt
          echo "installer exit: ${PIPESTATUS[0]}"
          [ -s /tmp/forbidden ] && { echo "it called:"; cat /tmp/forbidden; exit 1; } || true
          grep -q "^\[1/7\] making sure a container runtime" /tmp/T.txt || { echo "the runtime phase is not step 1"; exit 1; }
          # Only a step that actually ran past ten seconds owes a heartbeat. pacman on a warm mirror
          # finishes in two, and asserting otherwise tests the mirror, not the installer.
          if grep -qE "done in ([1-9][0-9]|[0-9]{3,})s" /tmp/T.txt; then
            grep -qE "^ +[0-9]+s +" /tmp/T.txt || { echo "a step ran over 10s with no heartbeat"; exit 1; }
          else
            echo "  (every step finished under 10s on this runner; nothing owed a heartbeat)"
          fi
          grep -q "^install OK — ci-clean," /tmp/T.txt || { echo "the answers file was ignored: $(grep '^install OK' /tmp/T.txt)"; exit 1; }
          grep -qi "Something went wrong" /tmp/T.txt && { echo "still says Something went wrong"; exit 1; } || true
          # And the node ANSWERS. "install OK" means seven steps finished and the database went healthy; it
          # does not mean the app container is still up, because `docker compose up -d` returns when a
          # container starts and not when it works. That gap is the whole difference on a new architecture:
          # an app image can build and start on arm64 and then die on its first import. It was measured
          # doing exactly that on a 2022 LinuxKit kernel — SIGILL out of cryptography's Rust bindings, by
          # way of mcp -> pyjwt — so the one check that would have caught it belongs here on every leg.
          for i in $(seq 40); do curl -fsS "http://127.0.0.1:PORT_PLACEHOLDER/health" >/dev/null 2>&1 && break; sleep 3; done
          curl -fsS "http://127.0.0.1:PORT_PLACEHOLDER/health" > /tmp/H.json \
            || { echo "the installer said OK and /health does not answer"; docker logs "$(docker ps -aq --filter name=app | head -1)" 2>&1 | tail -30; exit 1; }
          python3 -c "import json;d=json.load(open('/tmp/H.json'));print('  /health:', d['node'], d['version'], 'schema', d['schema']);assert 'schema' in d" \
            || { echo "/health answered something that is not a node"; cat /tmp/H.json; exit 1; }
          echo "ok on this userland"
          INNER
          # the matrix's prep line, spliced in without YAML fighting the shell
          python3 - <<'PYP'
          import os
          s = open('/tmp/run.sh').read()
          s = s.replace('PREP_PLACEHOLDER', os.environ['PREP'])
          s = s.replace('PROJECT_PLACEHOLDER', os.environ['PROJECT'])
          s = s.replace('PORT_PLACEHOLDER', os.environ['PORT'])
          s = s.replace('REF_PLACEHOLDER', os.environ['REF'])
          open('/tmp/run.sh','w').write(s)
          PYP
          # The daemon is the HOST's, so every bind mount in docker-compose.yml — ./init.sql, ./config,
          # ./packs — is resolved on the host, not inside this container. Mount the node's home at the
          # SAME path on both sides and the two agree. Without this the database gets an empty directory
          # where init.sql should be and comes up unhealthy, which is how Arch failed and Ubuntu did not:
          # a race, not a distribution difference.
          sudo mkdir -p /home/tester && sudo chmod 777 /home/tester
          docker run --rm --network host \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v /home/tester:/home/tester \
            -v "$PWD:/work:ro" -v /tmp/run.sh:/run.sh:ro \
            ${{ matrix.image }} bash /run.sh
        env:
          PREP: ${{ matrix.prep }}
          PROJECT: ${{ matrix.project }}
          PORT: ${{ matrix.port }}
          # For a pull request GITHUB_SHA is the merge commit, which raw.githubusercontent does not serve.
          # The head sha is the one that is really pushed to this repository.
          REF: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: leave the daemon as we found it
        if: always()
        run: |
          docker compose -p ${{ matrix.project }} down -v >/dev/null 2>&1 || true
          sudo rm -rf /home/tester || true
      - name: what a tester would paste into an issue
        if: always()
        run: bash tools/preflight.sh --json || true


  # The site is one Cloudflare bucket with one writer. `tools/ship.sh` puts the same three files in a
  # GitHub Release as well, and a node reads either with nothing but PLANETAI_GET changed — the site
  # serves them under /get, a Release serves them flat, because a release asset name cannot hold a
  # slash. A mirror nobody has installed from is a claim, not a route, so this installs from one.
  #
  # Two steps, because the second cannot run until a signed release exists and the plumbing has to be
  # proved before that and not during it:
  #   · a flat layout served locally, signed with a throwaway key — every push, from today
  #   · the real https://github.com/.../releases/download/<tag>/ — once ship.sh has published one
  release-url:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: a flat mirror, signed, served with no /get segment
        run: |
          set -e
          mkdir -p /tmp/flat
          bash tools/bundle.sh /tmp/flat                       # tarball, SHA256 and VERSION, side by side
          ssh-keygen -q -t ed25519 -f /tmp/ci_key -N '' -C fabcity
          ssh-keygen -Y sign -f /tmp/ci_key -n planetai-node /tmp/flat/planetai-node.tar.gz
          ls -la /tmp/flat
          ( cd /tmp/flat && python3 -m http.server 8098 >/tmp/flat.log 2>&1 & )
          for i in $(seq 20); do curl -fsS http://127.0.0.1:8098/SHA256 >/dev/null 2>&1 && break; sleep 1; done
          # The stub is used as it is, with one substitution the release key makes unnecessary: the
          # committed signer is a placeholder until Tomas issues the key, and this leg has to exercise
          # the path that SUCCEEDS. Everything else — the URLs, the fetch, the verify — is the real file.
          blob=$(ssh-keygen -y -f /tmp/ci_key | awk '{print $2}')
          sed -E "s|^(fabcity ssh-ed25519 )[^ ]+|\1$blob|" install > /tmp/install.flat
          if cmp -s install /tmp/install.flat; then
            echo "the placeholder is gone from install — this leg no longer tests anything"; exit 1
          fi

      - name: install from the flat mirror, with only PLANETAI_GET changed
        env:
          PLANETAI_GET: http://127.0.0.1:8098
          PLANETAI_HOME: /home/runner/planetai-flat
          PLANETAI_REF: ${{ github.sha }}
        run: |
          cat > /tmp/node.json <<'JSON'
          {"name": "ci-mirror", "lat": 39.57, "lon": 2.65, "kind": "home", "sensor": {}}
          JSON
          timeout 900 bash -c 'cat /tmp/install.flat | bash -s -- --answers /tmp/node.json' </dev/null \
            2>&1 | tee /tmp/TRANSCRIPT_mirror.txt
          echo "installer exit: ${PIPESTATUS[0]}"
          grep -q "checksum verified"  /tmp/TRANSCRIPT_mirror.txt || { echo "no checksum check"; exit 1; }
          grep -q "signature verified" /tmp/TRANSCRIPT_mirror.txt || { echo "the install did not check the signature"; exit 1; }
          grep -q "^install OK — ci-mirror," /tmp/TRANSCRIPT_mirror.txt || { echo "the flat layout did not install"; exit 1; }

      - name: and it refuses the same mirror with one byte changed
        env:
          PLANETAI_GET: http://127.0.0.1:8098
          PLANETAI_HOME: /home/runner/planetai-bad
          PLANETAI_REF: ${{ github.sha }}
        run: |
          # Replace the tarball but keep BOTH published files consistent with it — a corrupted download
          # is not the threat. This is the threat: somebody who can write to the origin writes the
          # tarball and its checksum together, and the checksum agrees because they wrote it.
          printf 'not the node you asked for' >> /tmp/flat/planetai-node.tar.gz
          sha256sum /tmp/flat/planetai-node.tar.gz | awk '{print $1}' > /tmp/flat/SHA256
          set +e
          timeout 900 bash -c 'cat /tmp/install.flat | bash -s -- --answers /tmp/node.json' </dev/null \
            > /tmp/TRANSCRIPT_tampered.txt 2>&1
          rc=$?; set -e
          cat /tmp/TRANSCRIPT_tampered.txt
          [ "$rc" -eq 0 ] && { echo "it installed a tarball the release key never signed"; exit 1; } || true
          grep -q "checksum verified" /tmp/TRANSCRIPT_tampered.txt || { echo "fixture problem: the checksum should still match"; exit 1; }
          grep -q "not signed by the PLANETAI release key" /tmp/TRANSCRIPT_tampered.txt \
            || { echo "it refused, but not for the right reason"; exit 1; }
          [ -d /home/runner/planetai-bad ] && { echo "it unpacked something before refusing"; exit 1; } || true
          echo "the checksum agreed and the signature did not, which is the whole point"

      - name: the real GitHub Release, once one has been published
        id: rel
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          tag=""
          for t in $(gh release list --limit 20 --json tagName -q '.[].tagName' 2>/dev/null); do
            if gh release view "$t" --json assets -q '.assets[].name' 2>/dev/null \
                 | grep -qx 'planetai-node.tar.gz.sig'; then tag="$t"; break; fi
          done
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          [ -n "$tag" ] && echo "newest signed release: $tag" \
            || echo "no signed release published yet — the step below starts running at the first one"

      - name: start clean — an earlier leg's volume trips the reinstall guard now
        run: |
          # Since v0.80.2 the installer refuses a fresh .env over an existing planetai_db, and the flat
          # leg above leaves exactly that behind. The last signed release's tarball used to slip past the
          # basename-derived guard, so this leg never met the refusal until the guard learned the pinned
          # volume name. A tester on a used machine is meant to see the refusal and its two ways out;
          # this leg tests the install itself, so it starts clean, the way the fail leg already does.
          docker rm -f $(docker ps -aq --filter "name=planetai-") 2>/dev/null || true
          docker volume rm -f planetai_db >/dev/null 2>&1 || true

      - name: install from the release URL, with the stub exactly as committed
        if: steps.rel.outputs.tag != ''
        env:
          PLANETAI_GET: https://github.com/${{ github.repository }}/releases/download/${{ steps.rel.outputs.tag }}
          PLANETAI_HOME: /home/runner/planetai-gh
          PLANETAI_REF: ${{ steps.rel.outputs.tag }}
        run: |
          # No substitution here: this is the committed stub, the committed tools/allowed_signers, and a
          # tarball signed with the Foundation's own key. If this goes red, a tester's install is red too.
          timeout 900 bash -c 'cat install | bash -s -- --answers /tmp/node.json' </dev/null \
            2>&1 | tee /tmp/TRANSCRIPT_gh.txt
          echo "installer exit: ${PIPESTATUS[0]}"
          grep -q "signature verified" /tmp/TRANSCRIPT_gh.txt || { echo "the release URL installed without a signature check"; exit 1; }
          grep -q "^install OK — " /tmp/TRANSCRIPT_gh.txt || { echo "the release URL did not install"; exit 1; }

      - name: keep the transcripts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-url-transcripts
          path: |
            /tmp/TRANSCRIPT_mirror.txt
            /tmp/TRANSCRIPT_tampered.txt
            /tmp/TRANSCRIPT_gh.txt
          if-no-files-found: warn

  intel-mac:
    # A real Intel Mac, verified available: GitHub offers macos-15-intel and macos-26-intel. The oldest
    # Intel image, macos-13, has been retired, so there is NO hosted runner at the 13.5 floor — that
    # case stays a manual gate on a real Mac before each tag.
    #
    # These runners have no Docker daemon (licensing), so this job cannot finish an install. What it can
    # prove is the part that broke: on a Mac, the installer asks for no Xcode Command Line Tools, runs no
    # sudo, touches no Homebrew, and preflight names a runtime this macOS can actually run.
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: preflight, on Intel
        run: |
          bash tools/preflight.sh --json > /tmp/pf.json || true
          cat /tmp/pf.json
          python3 - /tmp/pf.json <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          assert d["arch"] == "x86_64", d["arch"]
          assert [c for c in d["checks"] if c["check"] == "os"][0]["ok"], "macOS 15 must clear the floor"
          print("  ok  Intel, above the floor")
          PY
      - name: shadow xcode-select, sudo and brew
        run: |
          mkdir -p /tmp/notools
          for t in sudo brew xcode-select git; do
            printf '#!/bin/sh\necho "$0 $*" >> /tmp/forbidden\nexit 1\n' > /tmp/notools/$t
            chmod +x /tmp/notools/$t
          done
          rm -f /tmp/forbidden
      - name: the bootstrap reaches the runtime check without asking for any of them
        env: { PLANETAI_HOME: /Users/runner/planetai }
        run: |
          cat > /tmp/node.json <<'JSON'
          {"name": "ci-node", "lat": 39.57, "lon": 2.65, "kind": "home", "sensor": {}}
          JSON
          # No daemon here, so this stops at the runtime check. It must stop there and nowhere earlier,
          # and it must not have called xcode-select, git, sudo or brew on the way.
          PATH="/tmp/notools:$PATH" timeout 600 bash -c 'cat install | bash -s -- --answers /tmp/node.json' </dev/null || true
          if [ -s /tmp/forbidden ]; then echo "the install called:"; cat /tmp/forbidden; exit 1; fi
          echo "no xcode-select, no git, no sudo, no brew"
